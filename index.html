<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Claro · Constelaciones</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ed;color:#283e36;font:16px/1.5 system-ui,sans-serif}main,header{max-width:1200px;margin:auto;padding:24px clamp(18px,4vw,58px)}header{display:flex;align-items:center;gap:12px;border-bottom:1px solid #cfcfc3}header strong{font:34px Georgia}header small{border-left:1px solid #bbbcb0;padding-left:14px;color:#56665a}h1,h2{font:normal clamp(32px,5vw,54px)/1.1 Georgia,serif;margin:12px 0 20px}h2{font-size:27px}p{margin:0 0 18px}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(245px,1fr);gap:22px}.panel,.theatre{border:1px solid #d2d4c7;border-radius:18px;background:#fffef8;padding:24px}.theatre{background:radial-gradient(ellipse at 45% 40%,#fffbec,#e4e5d6 85%);display:flex;flex-direction:column;min-height:430px;overflow:hidden}.stage{position:relative;flex:1;min-height:280px;isolation:isolate}.floor{position:absolute;inset:12% 3% 1%;border:1px solid #b6b79e;border-radius:50%;background:radial-gradient(ellipse at 48% 40%,#eddfbe,#d9c7a6 74%,#cab38e);box-shadow:0 6px 0 #c9b89a,0 17px 24px #514f411b}.figure{position:absolute;width:46px;height:65px;transform:translate(-50%,-88%);transition:left 2s ease-in-out,top 2s ease-in-out;--dark:#7c5035;--mid:#c38c62;--light:#f0c6a2}.figure.self{--dark:#28483d;--mid:#598373;--light:#97b6a3}.body,.head{position:absolute;background:linear-gradient(105deg,var(--light),var(--mid) 43%,var(--dark));box-shadow:inset -2px -3px 5px #0002}.body{inset:22px 8px 1px;border-radius:46% 46% 32% 32%;box-shadow:3px 5px 5px #40321f40}.head{inset:3px 11px auto;height:25px;border-radius:50%}.nose{position:absolute;top:13px;left:21px;width:6px;height:6px;border-radius:50%;background:var(--mid);box-shadow:1px 1px 2px #0003;transition:transform 1.5s}.legend{font-size:13px;display:flex;gap:16px;flex-wrap:wrap}.legend span:before{content:'●';color:#527968;margin-right:5px}.legend span+span:before{color:#b3815d}label{font-weight:600;display:block;margin:16px 0 7px}textarea,select,button{font:inherit;border-radius:9px}textarea,select{padding:10px;width:100%;border:1px solid #adb5a7;background:#fffcf6;color:inherit}textarea{resize:vertical}button{padding:11px 15px;border:1px solid #949e90;color:inherit;background:#fffdf7;cursor:pointer}button.primary{background:#324f43;color:white;border-color:#324f43}form button{width:100%;margin-top:20px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.caption{min-height:80px;border-top:1px solid #bfc1ae;padding-top:12px}.caption strong{display:block;font-size:13px}.caption em{font:normal 22px Georgia}.note{font-size:13px;color:#526255;margin:15px 0 0}[hidden]{display:none!important}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #99672e;outline-offset:3px}@media(max-width:760px){.layout{grid-template-columns:1fr}.theatre{min-height:330px;padding:15px}.stage{min-height:215px}.panel{padding:18px}.figure{scale:.85;transform-origin:0 0}}@media(prefers-reduced-motion:reduce){.figure,.nose{transition:none}}
.stage{min-height:390px}.floor{inset:6% 1% 1%}.figure,.figure.self{width:75px;height:88px;scale:1;transform:translate(-50%,-76%);text-align:center;transition:left 1.8s ease-in-out,top 1.8s ease-in-out}.figure svg{height:72px;width:54px;display:block;margin:auto;filter:drop-shadow(1px 2px 1px #58483824)}.tag{display:inline-block;background:#fffcf4ee;color:#3e463b;border-radius:8px;padding:1px 4px;white-space:nowrap;font:600 12px/1.4 system-ui}.speaking .tag{outline:2px solid #36765c}.caption em:empty{display:block}.stage+.caption{min-height:84px}@media(max-width:760px){.stage{min-height:360px}.figure{width:66px}.tag{font-size:11px}.theatre{padding:12px}}@media(prefers-reduced-motion:reduce){.figure{transition:none}}.caption #feeling{font-size:1rem;line-height:1.55;margin:.45rem 0}.caption #line:not(:empty){display:block;margin:.6rem 0}.caption{min-height:9rem}.figure.speaking .tag{background:#fff5cd}.legend span+span:before{color:#916958}.figure{padding:0;border:0;background:transparent;border-radius:8px}.figure svg{transform:skewX(var(--lean,0deg)) scaleX(var(--width,1));transform-origin:center 85%}.figure .direction{display:inline-block;font-style:normal;transform:rotate(var(--angle));margin-right:3px}.caption small{display:block;color:#486052;font-weight:650}.caption #speech{margin-top:10px}.caption button{margin-top:8px;font-size:.85rem;padding:4px 10px}</style></head><body><header><strong>Claro</strong><small>Constelaciones personales</small></header><main><h1 id="title">Tu constelación</h1><div class="layout"><section class="theatre" aria-label="Escena"><div class="legend"><span>Tu representante</span><span>Figuras anónimas</span></div><div class="stage" id="stage"><div class="floor"></div></div><div class="caption" aria-live="polite"><strong id="speaker"></strong><small>Lo que siento</small><p id="feeling"></p><div id="speech" hidden><small id="recipient"></small><em id="line"></em></div><button id="follow" type="button" hidden>Seguir la escena</button></div></section><aside class="panel"><form id="setup"><h2>Preparar la escena</h2><label for="subject">¿Qué asunto quieres constelar?</label><textarea id="subject" required maxlength="400" rows="3" placeholder="Escribe tu asunto en unas palabras"></textarea><button class="primary">Comenzar</button><p class="note">El asunto permanece en esta pestaña. La escena es una simulación simbólica.</p></form><section id="session" hidden><h2 id="phase">En movimiento</h2><p id="topic" style="overflow-wrap:anywhere;white-space:pre-wrap"></p><p id="guide">Puedes pulsar una figura para leer su vivencia, pausar la escena o pasar al cierre.</p><div class="actions"><button id="pause">Pausar</button><button id="closeScene">Ir al cierre</button><button id="again" class="primary" hidden>Nueva constelación</button></div></section></aside></div></main>
<script>
const el = id => document.getElementById(id);
const pick = items => items[Math.floor(Math.random() * items.length)];
const clamp = value => Math.max(0, Math.min(1, value));
const distance = (a,b) => Math.hypot(a.x-b.x,a.y-b.y);
const bearing = (a,b) => Math.atan2(b.y-a.y,b.x-a.x);
const delta = (a,b) => Math.atan2(Math.sin(b-a),Math.cos(b-a));
const shuffle = items => {
  const result = [...items];
  for(let i=result.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [result[i],result[j]]=[result[j],result[i]];
  }
  return result;
};
// Each expression combines brows, mouth, shoulders, arms and head inclination.
const expressions = {
  'Neutral':['M18 16h6 M29 16h6','M23 26h7','M16 39l-2 16 M37 39l2 16',0],
  'Calma':['M19 17h5 M29 17h5','M22 25q4 2 8 0','M16 39l-4 17 M37 39l4 17',0],
  'Miedo':['M18 18l6 -3 M29 15l6 3','M24 25q2 -3 5 0v2h-5z','M16 39l2 10 7 -5 M37 39l-2 10 -7 -5',-5],
  'Tristeza':['M18 18l6 -3 M29 15l6 3','M22 27q4 -5 8 0','M17 41l-1 17 M36 41l1 17',8],
  'Enfado':['M18 15l6 3 M29 18l6 -3','M22 26h9','M16 39l-6 9 8 5 M37 39l6 9 -8 5',-3],
  'Interés':['M18 15q3 -3 7 0 M29 17h5','M23 25q4 2 7 -1','M16 39l-4 13 M36 39l8 4 3 -6',5],
  'Alivio':['M18 16q3 -2 6 0 M29 16q3 -2 6 0','M21 24q5 7 11 0','M16 40l-6 13 M37 40l7 12',2]
};
const hair = ['M14 20V14Q15 2 27 4Q41 4 39 18L34 14L32 10Q24 16 16 13Z','M13 29Q9 8 20 5Q35 -1 40 12L41 31L35 29L35 14Q27 15 23 9Q20 15 16 16L17 29Z','M14 18Q8 14 13 10Q11 5 18 6Q20 0 26 5Q32 0 35 6Q43 5 39 13L36 18L34 12Q24 17 17 12Z'];
const clothes=['M15 35Q26 31 38 35L36 55H17Z','M18 35Q26 32 35 35L34 44L39 56H14L19 44Z','M16 35Q26 30 37 35L38 55H15Z'];
function avatar(f){
  const [brows,mouth,arms,tilt]=expressions[f.mood];
  const look=Math.cos(f.angle)*2.6;
  const back=Math.sin(f.angle)<-.75;
  return '<svg viewBox="0 0 54 78" aria-hidden="true"><ellipse cx="27" cy="74" rx="16" ry="3" fill="#423b3029"/><path d="M21 51l-2 19 M32 51l3 19" stroke="#485053" stroke-width="7" stroke-linecap="round"/><path d="M19 71h-4 M35 71h4" stroke="#383633" stroke-width="5" stroke-linecap="round"/><path d="'+clothes[f.cut]+'" fill="'+f.coat+'"/><path d="'+arms+'" fill="none" stroke="'+f.coat+'" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><g transform="rotate('+tilt+' 26 33)"><rect x="23" y="26" width="8" height="10" rx="3" fill="'+f.skin+'"/><ellipse cx="26" cy="19" rx="12" ry="14" fill="'+(back?f.hair:f.skin)+'"/><path d="'+hair[f.hairstyle]+'" fill="'+f.hair+'"/>'+(back?'':'<g transform="translate('+look+' 0)" fill="#302927" stroke="#302927" stroke-width="1.7" stroke-linecap="round"><path d="'+brows+'"/><circle cx="22" cy="20" r="1"/><circle cx="31" cy="20" r="1"/><path d="'+mouth+'" fill="none"/></g>')+'</g></svg>';
}
function draw(f){
  f.node.style.left=f.x+'%';f.node.style.top=f.y+'%';f.node.style.zIndex=Math.round(f.y);
  f.node.style.setProperty('--lean',Math.cos(f.angle)*5+'deg');f.node.style.setProperty('--width',1-Math.abs(Math.cos(f.angle))*.13);
  f.node.style.setProperty('--angle',f.angle+'rad');
  f.node.innerHTML=avatar(f)+'<span class="tag"><i class="direction" aria-hidden="true">➜</i>'+f.short+' · '+f.mood+'</span>';
  f.node.setAttribute('aria-label',f.name+', '+f.mood);
}
// Appearance and temperament vary independently of one another.
const palette=['#8a523d','#9b6246','#a27543','#805970','#6c627e','#79594b'];
const skinTones=['#f0c6a6','#ddab87','#c68e65','#aa7555','#88573e','#70472f'];
const hairTones=['#3e302e','#70503c','#87705d','#a68d66','#747276','#b3aaa1'];
const repertoire=Array.from({length:54},(_,i)=>({
  cut:i%3,hairstyle:Math.floor(i/3)%3,skin:skinTones[Math.floor(i/9)],
  hair:hairTones[(i+Math.floor(i/3))%6],coat:palette[(Math.floor(i/3)+Math.floor(i/9))%6]
}));
const sensations={
  Neutral:['Siento el peso repartido entre los dos pies. Respiro a mi ritmo. Todavía no hay una emoción que destaque ni una dirección hacia la que quiera ir.'],
  Interés:['Siento un cosquilleo en las manos y levanto un poco la barbilla. Me apetece mirar despacio; todavía estoy descubriendo cuánto quiero acercarme.','Se me despeja la mirada. El cuerpo se inclina un poco y siento curiosidad por lo que hay en esa dirección.'],
  Tristeza:['Me pesan los hombros y noto un nudo en la garganta. Tengo ganas de recoger los brazos y darme un momento antes de volver a levantar la mirada.','Noto un peso suave en el pecho. Me cuesta sostener la mirada y preferiría quedarme aquí un momento.'],
  Miedo:['Se me acorta la respiración y aprieto los dedos. Una parte de mí quiere mirar; otra necesita conservar espacio para poder hacerlo.','Noto el estómago encogido y el peso en los talones. Quiero asegurarme de que tengo espacio antes de decidir si doy otro paso.'],
  Enfado:['Aprieto la mandíbula y noto calor en la cara. Siento con claridad hasta dónde quiero llegar y me nace el impulso de marcar esa distancia.','Se me tensan los antebrazos. Me gustaría tener más espacio y noto la fuerza con la que mis pies se afirman en el suelo.'],
  Calma:['Noto el apoyo de las plantas de los pies y puedo soltar los hombros. Me resulta cómodo respirar aquí y dejar que el siguiente movimiento espere.','La respiración me sale regular. Puedo quedarme en este lugar y mirar alrededor con tranquilidad.'],
  Alivio:['Suelto el aire que estaba reteniendo. Los brazos pesan menos y empiezo a sentir que puedo descansar en esta posición.','La tensión del cuello empieza a ceder. Puedo abrir las manos y sostener la mirada sin tener que decidir enseguida qué hacer.']
};

const figures=[], pool=shuffle(repertoire);
let phase='setup', paused=false, timer, selected=null, active=null, partner=null;
let turns=0, stillness=0, sinceEntry=0, lastSpeech=-9, gaze=null, reply=null;
const entryPlaces=[[18,28],[50,28],[82,28],[18,56],[82,56],[18,85],[50,85],[82,85]];
function render(){
  const f=selected||active;
  el('speaker').textContent=f.name+' · '+f.mood;
  el('feeling').textContent=f.feeling;
  el('speech').hidden=!f.words;
  el('recipient').textContent=f.words?'Lo que digo a '+f.listener:'';
  el('line').textContent=f.words?'«'+f.words+'»':'';
  el('follow').hidden=!selected||phase==='final';
  figures.forEach(other=>{
    other.node.classList.toggle('speaking',other===f);
    other.node.setAttribute('aria-pressed',String(selected===other));
  });
}
function experience(f,mood,context,impulse){
  const previous=f.mood;
  const body=pick(sensations[mood].filter(s=>sensations[mood].length===1||s!==f.body));
  f.body=body;f.mood=mood;f.words='';
  const change=previous!==mood && previous!=='Neutral'?'Hace un momento sentía '+previous.toLowerCase()+'. ':'';
  f.feeling=[context,change+body,impulse].filter(Boolean).join(' ');
  draw(f);
}
function add(x,y){
  const index=figures.length,node=document.createElement('button');
  node.type='button';node.className='figure';el('stage').append(node);
  const f={...pool.pop(),node,x,y,angle:Math.PI/2,mood:'Neutral',name:index?'Figura '+index:'Tu representante',short:index?'F'+index:'Tú',
    reserve:Math.random(),relations:new Map(),soloPauses:0};
  if(!index)f.coat='#356c59';
  figures.push(f);node.onclick=()=>{selected=f;render()};return f;
}
function link(a,b){
  if(!a.relations.has(b))a.relations.set(b,{space:a.reserve*.65+Math.random()*.35,trust:.25+Math.random()*.45,visits:0,last:'',impact:0});
  return a.relations.get(b);
}
function placeFree(f,x,y){
  return x>=15&&x<=85&&y>=26&&y<=89&&figures.every(o=>o===f||Math.abs(o.x-x)>=20||Math.abs(o.y-y)>=21);
}
function move(f,angle,amount){
  const x=f.x+Math.cos(angle)*amount,y=f.y+Math.sin(angle)*amount;
  if(!placeFree(f,x,y))return false;
  f.x=x;f.y=y;return true;
}
function emptyPlace(f){
  const options=shuffle(entryPlaces).map(([x,y])=>({x,y})).filter(p=>placeFree(null,p.x,p.y));
  return options.sort((a,b)=>Math.abs(delta(f.angle,bearing(f,a)))-Math.abs(delta(f.angle,bearing(f,b))))[0];
}
function watch(f,spot){
  f.angle=bearing(f,spot);gaze={f,spot};active=f;
  experience(f,'Interés','Mi mirada se ha quedado en un lugar vacío.','Me apetece seguir mirando allí un poco más.');
}
function enter(){
  const {f,spot}=gaze;gaze=null;
  const newcomer=add(spot.x,spot.y);newcomer.angle=bearing(newcomer,f);
  experience(newcomer,pick(['Interés','Miedo','Calma']),'Al entrar veo una figura orientada hacia este lado.','Me quedo en el borde mientras me acostumbro a esta distancia.');
  experience(f,f.mood,'Donde antes veía un espacio vacío, ahora hay una figura.','Mantengo los pies donde estaban mientras noto este cambio.');
  active=newcomer;partner=f;sinceEntry=0;stillness=0;
}
function alongside(a,b){
  const options=[-1,1].map(side=>({x:b.x+side*23*Math.cos(b.angle+Math.PI/2),y:b.y+side*23*Math.sin(b.angle+Math.PI/2)}))
    .filter(p=>placeFree(a,p.x,p.y)).sort((p,q)=>distance(a,p)-distance(a,q));
  if(!options.length)return false;
  const p=options[0],d=distance(a,p);
  // Take a small step along a clear path; only call it side-by-side on arrival.
  if(d>13||d<1||!move(a,bearing(a,p),d))return false;
  a.angle=b.angle;return true;
}
function receive(f,other,gesture){
  const m=link(f,other),wantedSpace=m.space>m.trust;
  const subject=other.name.toLowerCase();
  if(gesture==='withdraw'){
    experience(f,wantedSpace?'Alivio':'Tristeza','Veo que '+subject+' da un paso atrás.',wantedSpace?'Estaba buscando un poco de aire y ahora puedo quedarme.':'Me había dispuesto a acercarme. Siento esa distancia antes de moverme.');
    m.trust=clamp(m.trust+(wantedSpace?.13:-.09));m.space=clamp(m.space+(wantedSpace?-.10:.05));
  }else if(gesture==='approach'||gesture==='half'){
    experience(f,wantedSpace?'Miedo':'Interés',gesture==='half'?'He visto cómo empezaba a acercarse y se detenía.':'La distancia entre los dos ha disminuido.',wantedSpace?'Quiero tiempo para decidir cuánto espacio necesito.':'Me apetece sostener este encuentro un poco más.');
    m.space=clamp(m.space+(wantedSpace?.13:-.06));m.trust=clamp(m.trust+(wantedSpace?-.06:.1));
  }else if(gesture==='side'){
    experience(f,wantedSpace?'Interés':'Calma','Ahora tengo compañía a mi lado.','Puedo mirar hacia delante y seguir notando su presencia.');
  }
  m.last=gesture;m.impact+=gesture==='still'?0:1;
}
function encounter(a,b){
  const m=link(a,b),angle=bearing(a,b),d=distance(a,b);
  const previous=m.last, eager=m.trust+(d>38?.18:0),guard=m.space+(d<29?.14:0);
  const difference=guard-eager;let gesture='still',mood=a.mood,context='',impulse='';
  if(Math.abs(delta(a.angle,angle))>1.35){
    a.angle+=delta(a.angle,angle)*.72;gesture='turn';mood='Interés';context='Primero giro el cuerpo hacia la otra figura.';impulse='Los pies siguen donde estaban.';
  }else if(difference>.10 && move(a,angle,-6)){
    gesture='withdraw';mood=guard>.8?'Enfado':'Miedo';context='He dado un paso atrás para recuperar espacio.';impulse='Todavía quiero ver qué ocurre desde aquí.';m.space=clamp(m.space-.10);
  }else if(m.visits && m.trust>.40 && alongside(a,b)){
    gesture='side';mood='Calma';context='Me he colocado a su lado y miramos en la misma dirección.';impulse='Puedo acompañar sin tener que mantener el contacto visual.';
  }else if(d>28 && difference<.16 && move(a,angle,difference>-.13?3:7)){
    const hesitant=difference>-.13;gesture=hesitant?'half':'approach';mood=hesitant?'Miedo':'Interés';context=hesitant?'He iniciado un paso hacia esa figura y me he parado a mitad.':'Me he acercado un poco.';impulse=hesitant?'Siento curiosidad y también reparo. Prefiero esperar aquí.':'Quiero ver cómo me encuentro a esta distancia.';
  }else{
    a.angle=angle;mood=difference>.1?'Miedo':a.mood==='Tristeza'?'Tristeza':'Calma';context='Esta vez mantengo la distancia.';impulse=difference>.1?'Me gustaría apartarme un poco más. Por ahora sigo aquí.':'Puedo mirar sin dar otro paso.';
  }
  experience(a,mood,context,impulse);receive(b,a,gesture);
  m.visits++;link(b,a).visits++;m.impact+=gesture==='still'?0:1;m.last=gesture;
  let words='';
  if(previous==='withdraw'&&gesture==='still')words='Puedo respetar esa distancia.';
  if(gesture==='half')words='Dame un momento.';
  if(gesture==='side')words='Puedo estar aquí contigo.';
  if(gesture==='withdraw'&&m.visits>1)words='Hasta aquí está bien para mí.';
  if(words&&turns-lastSpeech>=4){
    a.words=words;a.listener=b.name.toLowerCase();lastSpeech=turns;reply={f:b,other:a,words};
  }
  active=a;partner=b;stillness=gesture==='still'?stillness+1:0;
}
function respond(){
  const {f,other,words}=reply;reply=null;const m=link(f,other);
  const receptive=m.space<=m.trust;
  experience(f,f.mood,'Acabo de escuchar «'+words+'».',receptive?'Quiero dejar que esas palabras reposen. De momento sigo aquí.':'Necesito tiempo para notar qué me pasa al oírlas. Mantengo la distancia.');
  active=f;partner=other;
}
function finish(){
  clearTimeout(timer);paused=false;phase='final';gaze=null;reply=null;
  el('phase').textContent='Escena sanadora';el('guide').textContent='La imagen queda en silencio. Puedes pulsar cada figura para leer cómo se encuentra.';
  el('pause').hidden=true;el('closeScene').hidden=true;el('again').hidden=false;
  for(const f of figures)f.words='';
  render();
}
function closeScene(){
  if(phase==='final'||phase==='closing')return;
  clearTimeout(timer);paused=false;phase='closing';el('phase').textContent='Movimiento de cierre';el('pause').textContent='Pausar';el('closeScene').hidden=true;
  if(reply)respond();
  // Keep the positions and emotions reached. Highlight the most changed relationship.
  let strongest=0,closingFigure=active,other=null,history=null;
  for(const f of figures)for(const [peer,m] of f.relations)if(m.impact>strongest){strongest=m.impact;closingFigure=f;other=peer;history=m}
  active=closingFigure;active.words='';
  if(history){
    if(history.last==='side')active.angle=other.angle;
    if(history.last==='half'||history.last==='approach')active.angle+=delta(active.angle,bearing(active,other))*.4;
    const ending={withdraw:'Conservo el espacio que se ha abierto entre los dos.',side:'Puedo quedarme a su lado mirando en esta dirección.',half:'Dejo el paso ahí, hasta donde he podido llegar.',approach:'Me quedo en esta nueva distancia.',turn:'Sostengo la mirada desde donde estoy.',still:'Por ahora este es mi lugar.'};
    active.feeling+=' '+(ending[history.last]||'Permanezco aquí.');draw(active);
  }
  el('guide').textContent='El grupo conserva la última disposición. Observa la distancia y la mirada de cada figura.';
  render();schedule(8500);
}
function schedule(ms){clearTimeout(timer);if(!paused)timer=setTimeout(tick,ms)}
function tick(){
  if(paused||phase==='final')return;
  if(phase==='closing'){finish();return}
  const self=figures[0];
  if(phase==='opening'){
    phase='solo';el('phase').textContent='Tu movimiento';
    self.angle=Math.random()*2*Math.PI;move(self,self.angle,8);
    experience(self,pick(['Miedo','Calma','Interés','Tristeza','Enfado']),'Al separarme del centro, noto el cambio de apoyo en las piernas.','Me doy tiempo antes de decidir hacia dónde seguir.');
  }else if(phase==='solo'){
    if(!self.soloPauses && ['Tristeza','Miedo','Enfado'].includes(self.mood)){
      self.soloPauses++;self.angle+=.35;
      experience(self,self.mood,'Todavía estoy sintiendo aquel primer paso.','Me detengo antes de volver a mirar alrededor.');
    }else{watch(self,emptyPlace(self));phase='waiting'}
  }else if(gaze){
    enter();phase='live';el('phase').textContent='Encuentro';
  }else if(reply){respond()}
  else if(phase==='live'){
    turns++;sinceEntry++;
    if((stillness>=3 && sinceEntry>=3)||turns>=24){closeScene();return}
    const observer=partner,spot=emptyPlace(observer),m=link(observer,active);
    if(figures.length<7 && spot && sinceEntry>=3 && m.visits>=2 && (m.space>m.trust||stillness>0) && Math.random()<.55){
      watch(observer,spot);
    }else{
      const witnesses=figures.filter(f=>f!==observer&&f!==active);
      const next=witnesses.length&&sinceEntry>1&&Math.random()<.30?
        witnesses.sort((x,y)=>Math.abs(delta(observer.angle,bearing(observer,x)))-Math.abs(delta(observer.angle,bearing(observer,y))))[0]:active;
      encounter(observer,next);
    }
  }
  render();schedule(10500);
}
const self=add(50,50);
experience(self,'Neutral','','');active=self;render();
el('setup').onsubmit=e=>{
  e.preventDefault();const subject=el('subject').value.trim();
  if(!subject){el('subject').value='';el('subject').reportValidity();return}
  el('topic').textContent=subject;el('setup').hidden=true;el('session').hidden=false;el('phase').textContent='Imagen inicial';el('phase').tabIndex=-1;el('phase').focus();
  phase='opening';selected=null;render();schedule(6000);
};
el('follow').onclick=()=>{selected=null;render()};
el('pause').onclick=()=>{paused=!paused;el('pause').textContent=paused?'Continuar':'Pausar';if(paused)clearTimeout(timer);else schedule(900)};
el('closeScene').onclick=closeScene;
el('again').onclick=()=>location.reload();
</script></body></html>
